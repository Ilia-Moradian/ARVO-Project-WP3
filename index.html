<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARVO Capacity Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;display:flex;height:100vh;font-family:'Segoe UI',Tahoma,sans-serif;background:#ecf0f1;color:#fff}
#map{flex:3;height:100%}
#side{flex:1;min-width:330px;max-width:430px;background:#2c3e50;padding:18px;overflow-y:auto;font-size:.9rem}
h2{margin:0 0 10px;color:#1abc9c;font-size:1.2rem;border-bottom:2px solid #34495e;padding-bottom:8px}
h3{margin:16px 0 6px;font-size:.95rem;color:#f1c40f}
label{display:block;margin:10px 0 3px;color:#bdc3c7;font-size:.82rem}
label.chk{display:flex;gap:8px;align-items:center;color:#fff;font-size:.88rem;margin:14px 0}
select,input[type=number]{width:100%;padding:8px;background:#34495e;color:#fff;border:1px solid #1abc9c;border-radius:4px;font-size:.9rem}
input[type=range]{width:100%}
button#go{width:100%;padding:13px;margin:6px 0 4px;background:#1abc9c;color:#fff;border:0;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer}
button#go:hover{background:#16a085}
button#go:disabled{background:#4b6074;cursor:wait}
.note{background:#4a3f12;border-left:4px solid #f1c40f;padding:8px 10px;margin:6px 0;font-size:.8rem;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#34495e;border-left:4px solid #1abc9c;border-radius:6px;padding:8px 10px}
.box b{display:block;font-size:1.35rem;color:#f1c40f}
.box span{font-size:.72rem;color:#bdc3c7}
#msg{margin:10px 0;padding:8px 10px;border-radius:4px;background:#34495e;line-height:1.4}
#msg.warn{background:#7b2d26}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:5px 4px;text-align:left;border-bottom:1px solid #3d566e}
tr.cur td{color:#f1c40f;font-weight:600}
.legend{background:#fff;color:#333;padding:10px;border-radius:6px;line-height:1.7;box-shadow:0 0 12px rgba(0,0,0,.25);font-size:.8rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
/* KSI logo above the zoom buttons */
.logo{background:#fff;padding:6px 10px;border-radius:6px;box-shadow:0 1px 8px rgba(0,0,0,.35)}
.logo img{display:block;height:55px;width:auto;max-width:288px}
/* project pins: bigger than firm dots, always above them */
.pj{position:relative;width:0;height:0}
.pj-dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#1b2a49;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pj-pin{position:absolute;left:-17px;top:-41px;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#c0392b;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.55)}
.pj-pin::after{content:'';position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff}
.pj-tag{position:absolute;left:24px;top:-38px;white-space:nowrap;background:#c0392b;color:#fff;padding:3px 9px;border-radius:4px;font:600 12px 'Segoe UI',Tahoma,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pj.on::before,.pj.on::after{content:'';position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(192,57,43,.75);background:rgba(192,57,43,.07);opacity:0;animation:pulse 2.8s ease-out infinite}
.pj.on::after{animation-delay:1.4s}
.pj.off .pj-pin{background:#7f8c8d;transform:rotate(-45deg) scale(.8);transform-origin:50% 100%}
.pj.off .pj-dot{background:#7f8c8d}
.pj.off .pj-tag{background:#7f8c8d;font-size:11px;opacity:.85}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}60%{opacity:.25}100%{transform:scale(2.2);opacity:0}}
@media(max-width:800px){body{flex-direction:column;height:auto}#map{height:55vh;flex:none}#side{max-width:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="side">
  <h2>ARVO Capacity Explorer</h2>
  <div class="note" id="srcnote"></div>

  <label for="demand">Where is the project?</label>
  <select id="demand"></select>
  <label for="svc">What does the project need?</label>
  <select id="svc">
    <option value="metal">Metal fabrication and welding</option>
    <option value="electrical">Electrical and hydrogen equipment</option>
    <option value="logistics">Transport and logistics</option>
    <option value="civil">Site services and civil works</option>
  </select>
  <label for="units">How much is needed? (units per year)</label>
  <input type="number" id="units" value="9000" step="500" min="500">
  <label for="profile">What matters most to the buyer?</label>
  <select id="profile"></select>
  <label for="radius">Maximum driving distance: <span id="radiusV"></span> km</label>
  <input type="range" id="radius" min="10" max="250" step="5" value="150">
  <label for="maxf">Maximum number of firms: <span id="maxfV"></span></label>
  <input type="range" id="maxf" min="1" max="15" value="6">
  <label class="chk"><input type="checkbox" id="t3"> Also include firms that need a lot of support</label>

  <button id="go">Find local suppliers</button>
  <div id="msg"></div>
  <div class="grid" id="stats">
    <div class="box"><b id="cov">–</b><span>Share of need covered</span></div>
    <div class="box"><b id="nf">–</b><span>Firms involved</span></div>
    <div class="box"><b id="capsel">–</b><span>Combined capacity</span></div>
    <div class="box"><b id="maxd">–</b><span>Farthest firm (km by road)</span></div>
  </div>
  <div id="cmpwrap">
    <h3>What if the buyer cared about something else?</h3>
    <table id="cmp"></table>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script>
if (!window.DATA) { document.body.innerHTML = '<p style="color:#333;padding:20px">data.js not found next to index.html.</p>'; throw new Error('no data'); }
const D = window.DATA, $ = id => document.getElementById(id);
const T1 = 0.15, T2 = -0.15;                       // readiness cut-offs
const COL = {1: '#2ecc71', 2: '#f39c12', 3: '#e74c3c'};
const TIERS = {1: 'Ready', 2: 'Needs some support', 3: 'Needs a lot of support'};
// weights order: capacity, delivery time, tracking and records, distance
const PROFILES = {
  A: {name: 'Fast delivery', w: [.20, .45, .15, .20]},
  B: {name: 'Large volumes', w: [.50, .20, .10, .20]},
  C: {name: 'Tracking and records', w: [.20, .20, .45, .15]}
};
let custom = null, ran = false;

function hav(a, b, c, d2) {
  const r = Math.PI / 180, h = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d2 - b) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const shortName = p => p.name.replace(' (approx. location)', '');
function getDemand() {
  const v = $('demand').value;
  return v === 'custom' ? custom : D.projects.find(p => p.id === v);
}

// Road distances and routes: OpenRouteService first (key in data.js), public OSRM demo server as fallback. Results are cached in the browser.
const ORS = 'https://api.heigit.org/openrouteservice/v2', OSRM = 'https://router.project-osrm.org';
let store = {t: {}, r: {}}, roadStatus = 'pending', roadSrc = '', tick = 0, q = Promise.resolve();
const inflight = {}, pend = {}, failed = {};
try { store = JSON.parse(localStorage.getItem('arvo-road-v3')) || store; } catch (e) {}
const save = () => { try { localStorage.setItem('arvo-road-v3', JSON.stringify(store)); } catch (e) {} };
const key = d => d.lat.toFixed(4) + ',' + d.lon.toFixed(4);
const wait = ms => new Promise(r => setTimeout(r, ms));
const orsPost = (path, body) => fetch(ORS + path, {method: 'POST', headers: {'Authorization': D.orsKey, 'Content-Type': 'application/json'}, body: JSON.stringify(body)})
  .then(async r => {
    if (!r.ok) { let m = ''; try { const e = await r.json(); m = (e.error && (e.error.message || e.error)) || JSON.stringify(e); } catch (x) {} throw new Error('ORS ' + r.status + ' ' + m); }
    return r.json();
  });

async function fetchTable(dem) {
  const pts = [[dem.lon, dem.lat]].concat(D.smes.map(s => [s.lon, s.lat]));
  const dst = D.smes.map((_, i) => i + 1);
  let dist, src;
  if (D.orsKey) {
    try { const j = await orsPost('/matrix/driving-car', {locations: pts, sources: [0], destinations: dst, metrics: ['distance'], units: 'km'}); dist = j.distances[0]; src = 'OpenRouteService'; }
    catch (e) { console.warn(e); }
  }
  if (!dist) {
    const r = await fetch(OSRM + '/table/v1/driving/' + pts.map(c => c.join(',')).join(';') + '?sources=0&destinations=' + dst.join(';') + '&annotations=distance');
    const j = await r.json();
    if (j.code !== 'Ok') throw new Error(j.code);
    dist = j.distances[0].map(v => v == null ? null : v / 1000); src = 'OSRM';
  }
  const m = {}; D.smes.forEach((s, i) => { if (dist[i] != null) m[s.id] = dist[i]; });
  return {m, src};
}
function roadDist(dem) {
  const k = key(dem), c = store.t[k];
  if (c) { roadStatus = 'ok'; roadSrc = c.src; return c.m; }
  if (!inflight[k]) {
    inflight[k] = true;
    fetchTable(dem).then(c => { store.t[k] = c; roadStatus = 'ok'; roadSrc = c.src; save(); update(); }).catch(() => { roadStatus = 'fail'; failed[k] = true; update(); });
  }
  return null;
}
function distTo(dem, s) {
  const t = roadDist(dem);
  return (t && t[s.id] != null) ? t[s.id] : hav(dem.lat, dem.lon, s.lat, s.lon) * D.detour;
}
async function fetchRoute(dem, s) {
  if (D.orsKey) {
    try {
      await wait(1000);   // stay under the free quota of 40 requests/minute
      const j = await orsPost('/directions/driving-car/geojson', {coordinates: [[dem.lon, dem.lat], [s.lon, s.lat]], radiuses: [-1, -1], instructions: false, geometry_simplify: true});
      return j.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
    } catch (e) { console.warn(e); }
  }
  await wait(1100);       // public OSRM server: max 1 request/second
  const r = await fetch(OSRM + '/route/v1/driving/' + dem.lon + ',' + dem.lat + ';' + s.lon + ',' + s.lat + '?overview=simplified&geometries=geojson');
  const j = await r.json();
  return j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
}
function getRoute(dem, s, k) {
  if (pend[k]) return pend[k];
  const p = q.catch(() => {}).then(() => fetchRoute(dem, s)).then(pts => { store.r[k] = pts; save(); return pts; });
  q = p; p.catch(() => { delete pend[k]; });
  return pend[k] = p;
}
function drawRoute(dem, s, my) {
  const k = key(dem) + '>' + s.id;
  const line = (pts, dash) => { if (my === tick) L.polyline(pts, {color: '#3498db', weight: 4, opacity: .65, dashArray: dash}).addTo(lineLayer); };
  if (store.r[k]) return line(store.r[k]);
  getRoute(dem, s, k).then(pts => line(pts)).catch(() => line([[dem.lat, dem.lon], [s.lat, s.lon]], '5,5'));
}
function setNote() {
  const n = $('srcnote');
  n.title = roadSrc;
  n.textContent = roadStatus === 'fail' ? 'Demo with made-up firms. The road service is not reachable, so distances are rough estimates.'
    : roadStatus === 'ok' ? 'Demo with made-up firms. Distances follow real roads.' : 'Loading road distances…';
}

// Step 1 scores every firm, step 2 picks the best ones inside the driving distance until the need is covered.
function evaluate(cfg, prof) {
  const cand = D.smes.filter(s => s.cap[cfg.svc] > 0).map(s => ({s, cap: s.cap[cfg.svc], lead: s.lead, trace: s.trace, dist: distTo(cfg.demand, s), phi: 0}));
  const crit = [['cap', 1], ['lead', -1], ['trace', 1], ['dist', -1]], n = cand.length, rng = {};
  crit.forEach(([k]) => { const v = cand.map(c => c[k]); rng[k] = (Math.max(...v) - Math.min(...v)) || 1; });
  cand.forEach(a => {
    cand.forEach(b => {
      if (a === b) return;
      crit.forEach(([k, dir], j) => { const d = dir * (a[k] - b[k]) / rng[k]; a.phi += prof.w[j] * (Math.max(0, d) - Math.max(0, -d)) / ((n - 1) || 1); });
    });
    a.tier = a.phi >= T1 ? 1 : a.phi >= T2 ? 2 : 3;
  });
  const pool = cand.filter(c => c.dist <= cfg.radius && (c.tier < 3 || cfg.t3)).sort((x, y) => y.phi - x.phi);
  const picked = []; let got = 0;
  for (const c of pool) { if (got >= cfg.units || picked.length >= cfg.maxf) break; picked.push(c); got += c.cap; }
  const lead = got ? picked.reduce((t, c) => t + c.lead * c.cap, 0) / got : 0;
  return {cand, pool, picked, got, cov: Math.min(1, got / cfg.units), maxd: Math.max(0, ...picked.map(c => c.dist)), lead};
}

const map = L.map('map', {zoomControl: false}).setView([64.5, 25.0], 7);
const logo = L.control({position: 'topleft'});   // KSI logo sits above the zoom buttons
logo.onAdd = () => { const d = L.DomUtil.create('div', 'logo'); d.innerHTML = '<img src="KSI_logo_ENG.jpg" alt="Kerttu Saalasti Institute, University of Oulu" onerror="this.parentNode.style.display=\'none\'">'; L.DomEvent.disableClickPropagation(d); return d; };
logo.addTo(map);
L.control.zoom({position: 'topleft'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
const smeLayer = L.layerGroup().addTo(map), demLayer = L.layerGroup().addTo(map), lineLayer = L.layerGroup().addTo(map);

D.projects.forEach(p => $('demand').add(new Option(shortName(p), p.id)));
$('demand').add(new Option('My own location (click on the map)', 'custom'));
Object.keys(PROFILES).forEach(k => $('profile').add(new Option(PROFILES[k].name, k)));

const reset = () => { ran = false; update(); };
map.on('click', e => { custom = {lat: e.latlng.lat, lon: e.latlng.lng}; $('demand').value = 'custom'; reset(); });
['demand', 'svc', 'units', 'profile', 'radius', 'maxf', 't3'].forEach(id => $(id).addEventListener('input', reset));
$('go').addEventListener('click', () => { ran = true; update(); });

function update() {
  $('radiusV').textContent = $('radius').value; $('maxfV').textContent = $('maxf').value;
  const my = ++tick; setNote();
  smeLayer.clearLayers(); demLayer.clearLayers(); lineLayer.clearLayers();
  const dem = getDemand(), msg = $('msg'), show = ran ? '' : 'none';
  $('stats').style.display = show; $('cmpwrap').style.display = show;
  const pin = (lat, lon, label, on) => L.marker([lat, lon], {icon: L.divIcon({className: '', iconSize: [0, 0], html: '<div class="pj ' + (on ? 'on' : 'off') + '"><div class="pj-dot"></div><div class="pj-pin"></div><div class="pj-tag">' + label + '</div></div>'}), zIndexOffset: on ? 2000 : 1000}).addTo(demLayer);
  D.projects.forEach(p => pin(p.lat, p.lon, shortName(p), dem && dem.id === p.id).on('click', () => { $('demand').value = p.id; reset(); }));
  if (!dem) { msg.className = ''; msg.textContent = 'Click anywhere on the map to place your project.'; $('go').disabled = true; return; }
  if (!dem.id) pin(dem.lat, dem.lon, 'Your project', true);

  const cfg = {demand: dem, svc: $('svc').value, units: +$('units').value || 1, radius: +$('radius').value, maxf: +$('maxf').value, t3: $('t3').checked};
  const r = evaluate(cfg, PROFILES[$('profile').value]);
  const k = key(dem), waiting = !store.t[k] && !failed[k];
  $('go').disabled = waiting; $('go').textContent = waiting ? 'Loading road distances…' : (ran ? 'Show again' : 'Find local suppliers');

  r.cand.forEach(c => {
    const sel = ran && r.picked.includes(c), dim = ran && !r.pool.includes(c);
    L.circleMarker([c.s.lat, c.s.lon], {radius: 5 + Math.sqrt(c.cap) / 10, fillColor: COL[c.tier], color: sel ? '#000' : '#2c3e50', weight: sel ? 3 : 1, fillOpacity: dim ? .25 : .9, opacity: dim ? .4 : 1, bubblingMouseEvents: false})
      .bindPopup('<b>' + c.s.name + '</b><br>Readiness: ' + TIERS[c.tier] + '<br>Capacity: ' + c.cap.toLocaleString() + ' units per year<br>Delivery time: ' + c.lead + ' days<br>Tracking and records: ' + Math.round(c.trace * 100) + '%<br>Distance: ' + c.dist.toFixed(0) + ' km by road' + (roadStatus === 'ok' ? '' : ' (rough)') + (sel ? '<br><b>Chosen for this project</b>' : '')).addTo(smeLayer);
  });
  if (!ran) { msg.className = ''; msg.textContent = 'Choose your settings, then press "Find local suppliers".'; return; }

  r.picked.forEach((c, i) => setTimeout(() => { if (my === tick) drawRoute(dem, c.s, my); }, i * 700));   // routes appear one by one
  $('cov').textContent = Math.round(r.cov * 100) + '%';
  $('nf').textContent = r.picked.length + ' of ' + cfg.maxf;
  $('capsel').textContent = r.got.toLocaleString();
  $('maxd').textContent = r.picked.length ? r.maxd.toFixed(0) : '–';
  const n = r.picked.length;
  if (r.cov >= 1) { msg.className = ''; msg.textContent = (n === 1 ? '1 firm can' : n + ' firms together can') + ' supply the full amount. Average delivery time: ' + r.lead.toFixed(0) + ' days.'; }
  else { msg.className = 'warn'; msg.textContent = 'Only ' + Math.round(r.cov * 100) + '% of the need can be supplied locally. ' + (n >= cfg.maxf ? 'Allow more firms to get closer.' : 'Try a longer driving distance, or include firms that need a lot of support.'); }

  $('cmp').innerHTML = '<tr><th>Buyer priority</th><th>Covered</th><th>Firms</th><th>Farthest km</th></tr>' + Object.keys(PROFILES).map(p => {
    const x = evaluate(cfg, PROFILES[p]);
    return '<tr class="' + (p === $('profile').value ? 'cur' : '') + '"><td>' + PROFILES[p].name + '</td><td>' + Math.round(x.cov * 100) + '%</td><td>' + x.picked.length + '</td><td>' + (x.picked.length ? x.maxd.toFixed(0) : '–') + '</td></tr>';
  }).join('');
}

const legend = L.control({position: 'bottomright'});
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); d.innerHTML = '<b>How ready are the firms?</b><br><i style="background:#2ecc71"></i>Ready<br><i style="background:#f39c12"></i>Needs some support<br><i style="background:#e74c3c"></i>Needs a lot of support<br>Black ring: chosen for this project<br>Faded: too far away or left out'; return d; };
legend.addTo(map);
update();
</script>
</body>
</html>
